spring.application.name=java-exception-demo
server.port=8080

# Folder (relative to the working directory) holding account statement files.
# Used by the checked-exception demo (FileNotFoundException / IOException).
bank.statements.dir=statements

# Never leak stack traces or exception details to API clients (defence in depth:
# our GlobalExceptionHandler already returns a safe ApiError for every error).
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
